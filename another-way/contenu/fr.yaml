# ── Page d'accueil ──────────────────────────────────────────
accueil:
  banniere:
    image: "banniere-accueil.jpg"
    # Partie de la photo à garder visible : "haut", "centre" ou "bas"
    cadrage: "centre"
    # Position du texte sur la photo : "gauche" ou "droite"
    texte_position: "droite"
    image_alt: "Travail en liberté dans un manège couvert"
    surtitre: "Élodie Bourguignon"
    titre: "Another Way"
    sous_titre: "Débourrage · Éducation · Travail du cheval"
    bouton_prestations: "Découvrir les prestations"
    bouton_contact: "Me contacter"

  approche:
    surtitre: "L'approche"
    titre: "Une autre façon de travailler avec le cheval"
    texte: |
      Avant même de parler d'équitation ou de performance, une période de formation est nécessaire et trop souvent sous-estimée, afin de mettre en place les bases d'une communication saine.

      Spécialisée dans l'éducation équine ainsi que dans la rééducation comportementale des chevaux de sport et de loisir, Another Way, fondée en 2021, propose ses services à tout professionnel ou propriétaire rencontrant des difficultés avec ses chevaux ou souhaitant une approche respectant l'intégrité physique et mentale de l'animal.
    piliers:
      - titre: "Éducation"
        texte: "Une période de formation trop souvent sous-estimée, pour poser les bases d'une communication saine."
      - titre: "Respect"
        texte: "Une approche qui préserve l'intégrité physique et mentale du cheval."
      - titre: "Science"
        texte: "Une méthode éthique fondée sur les avancées scientifiques concernant les capacités cognitives du cheval."

  a_propos:
    surtitre: "À propos"
    titre: "Parcours professionnel"
    image: "elodie.jpg"
    image_alt: "Élodie Bourguignon avec un jeune cheval"
    texte: |
      Passionnée par les chevaux depuis toujours, c'est tout naturellement qu'Élodie Bourguignon passe son BPJEPS à Maisons-Laffitte. Elle part ensuite se former au pôle éducation du Haras de Hus auprès de Sébastien Jaulin et Robyn Arnold pendant 10 mois, avant d'y être engagée pendant 2 ans. Durant cette période, elle valide le Brevet Fédéral d'Encadrement d'Équitation Éthologique de niveaux 1 et 2.

      Elle renforce ensuite temporairement l'équipe de Grégory Wathelet lors de la tournée espagnole du Sunshine Tour, puis est recrutée par l'élevage Massa pour le débourrage et l'éducation de leurs chevaux d'élevage durant 2 ans.

      Ces différentes expériences lui ont permis d'acquérir l'expertise professionnelle nécessaire pour vous proposer ses services sous le nom d'Another Way.
    reperes:
      - valeur: "BPJEPS"
        libelle: "Maisons-Laffitte"
      - valeur: "BFEEE 1 & 2"
        libelle: "Équitation éthologique"
      - valeur: "Depuis 2021"
        libelle: "Another Way"

  prestations:
    surtitre: "Prestations"
    titre: "Accompagner chaque cheval à son rythme"
    bouton: "Voir toutes les prestations et tarifs"

  galerie:
    surtitre: "Galerie"
    titre: "Au travail"
    fermer: "Fermer"
    precedente: "Photo précédente"
    suivante: "Photo suivante"
    images:
      - fichier: "galerie-01.jpg"
        alt: "Travail à la longe d'un jeune cheval"
      - fichier: "galerie-02.jpg"
        alt: "Jeune cheval monté en carrière"
      - fichier: "galerie-03.jpg"
        alt: "Ponying : un cheval monté accompagne un jeune cheval"
      - fichier: "galerie-04.jpg"
        alt: "En concours sur un cheval alezan"
      - fichier: "galerie-05.jpg"
        alt: "Chevaux au paddock sous les arbres"
      - fichier: "galerie-06.jpg"
        alt: "Séance montée en carrière"

  appel:
    titre: "Un projet pour votre cheval ?"
    texte: "Parlons de ses besoins et de vos objectifs."
    bouton: "Me contacter"

# ── Page Prestations et tarifs ─────────────────────────────
prestations:
  banniere:
    image: "banniere-prestations.jpg"
    # Partie de la photo à garder visible : "haut", "centre" ou "bas"
    cadrage: "haut"
    image_alt: "Ponying en manège : un cheval monté accompagne un jeune cheval"
    surtitre: "Prestations"
    titre: "Prestations et tarifs"
  intro: "Du cours individuel au débourrage, chaque prestation s'adapte au cheval, à son caractère et à ses capacités."
  libelle_tarif: "Tarif"
  bouton_devis: "Demander un devis"
  bouton_reserver: "Me contacter"

  # Liste des prestations. Pour en ajouter une, copiez un bloc complet
  # (de « - nom: » jusqu'à la ligne avant le « - nom: » suivant).
  #   accueil: true  → la prestation apparaît aussi sur la page d'accueil
  #   devis: true    → le bouton propose « Demander un devis »
  liste:
    - nom: "Cours individuel"
      tarif: "65 €"
      image: "prestation-cours.jpg"
      accueil: true
      description: "Un accompagnement personnalisé, cavalier et cheval ensemble, pour progresser à pied comme monté dans une relation de confiance et de respect mutuel."
      details: "Le contenu s'adapte au niveau, aux objectifs et au rythme de chaque couple."

    - nom: "Stage"
      tarifs:
        - libelle: "1 journée"
          prix: "130 €"
        - libelle: "½ journée"
          prix: "70 €"
      image: "prestation-stage.jpg"
      description: "Un temps dédié pour approfondir un thème : travail à pied, communication, bases de l'éducation ou préparation d'un objectif précis."

    - nom: "Passage de Savoir ou de Galop"
      tarifs:
        - libelle: "Savoir (équitation éthologique)"
          prix: "70 €"
        - libelle: "Galop"
          prix: "50 €"
      image: "prestation-examens.jpg"
      description: "Préparation et passage des Savoirs d'équitation éthologique (FFE) et des Galops, encadrés par une enseignante titulaire du BPJEPS et du Brevet Fédéral d'Encadrement d'Équitation Éthologique."

    - nom: "Séance d'évaluation"
      tarif: "100 €"
      image: "prestation-evaluation.jpg"
      description: "Une première rencontre pour observer le cheval, comprendre ses besoins et ses éventuelles difficultés, et définir ensemble le programme de travail le plus adapté."

    - nom: "Séance de travail du cheval"
      tarif: "50 €"
      image: "prestation-travail.jpg"
      accueil: true
      description: "Établissement des codes de la basse école, entretien physique et locomoteur."
      details: "Rendre le cheval plus pratique et perméable aux aides."

    - nom: "Pré-débourrage"
      tarif: "350 € / mois"
      frequence: "4 séances par semaine"
      image: "prestation-pre-debourrage.jpg"
      description: "Permet une éducation plus progressive en installant des codes en amont du débourrage."
      details: "La majeure partie du travail se fait au sol et comprend du contrôle des pieds et de la désensibilisation. Mise de la selle et montoirs suivant les capacités physiques du poulain."

    - nom: "Débourrage"
      tarif: "700 € / mois"
      frequence: "4 séances par semaine"
      image: "prestation-debourrage.jpg"
      accueil: true
      description: "Étape la plus importante dans la vie d'un cheval. Elle va déterminer et conditionner toute la future relation entre le poulain et l'homme, ainsi que l'association que le cheval va faire avec l'humain."
      details: "Le but est de rendre le cheval confiant, réceptif et perméable aux aides du cavalier. Chaque poulain étant différent, la durée peut varier d'un à plusieurs mois suivant le caractère et les capacités cognitives de chaque cheval."

    - nom: "Rééducation comportementale"
      tarif: "Sur devis"
      image: "prestation-reeducation.jpg"
      accueil: true
      devis: true
      description: "Des incompréhensions entre l'homme et le cheval peuvent amener à l'apparition de comportements non souhaités, voire dangereux. Le but est ici de comprendre pourquoi le cheval a développé ces comportements et de lui apprendre ceux souhaités."
      details: "Les exemples de rééducation sont nombreux et variés : embarquement, peur au montoir, agressivité, stress et anxiété…"

  deplacements:
    titre: "Déplacements"
    texte: "J'interviens près d'Orléans et en Île-de-France, ainsi que dans d'autres régions sur demande. Les frais de déplacement sont facturés {frais_km}, calculés depuis {ville_depart}."
  mention_tva: "Tous les tarifs sont indiqués nets – TVA non applicable, art. 293 B du CGI."

  appel:
    titre: "Une question, un projet ?"
    texte: "Demandez un devis personnalisé ou contactez-moi pour en parler."
    bouton: "Demander un devis"

