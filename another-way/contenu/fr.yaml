confidentialite:
  titre: "Politique de confidentialité"
  sections:
    - titre: "Responsable du traitement"
      texte: "{nom} – {nom_site}, {adresse}. Contact : {email}."
    - titre: "Données collectées"
      texte: "Le formulaire de contact recueille votre nom, votre adresse e-mail, votre numéro de téléphone (facultatif), l'objet de votre demande et votre message. Ces données sont utilisées uniquement pour répondre à votre demande, sur la base de votre consentement."
    - titre: "Transmission et conservation"
      texte: "Les messages sont transmis par e-mail via le service Resend (sous-traitant technique) et ne sont pas enregistrés sur le site. Ils sont conservés dans la messagerie de {nom} le temps nécessaire au traitement de votre demande et au maximum 3 ans après le dernier contact. Ils ne sont jamais vendus ni cédés."
    - titre: "Cookies"
      texte: "Ce site n'utilise aucun cookie de suivi ou de mesure d'audience. Les polices de caractères sont hébergées sur le site lui-même : aucune donnée n'est transmise à des services tiers lors de votre visite."
    - titre: "Vos droits"
      texte: "Conformément au RGPD, vous disposez d'un droit d'accès, de rectification, d'effacement, d'opposition et de limitation du traitement de vos données. Pour l'exercer, écrivez à {email}. Vous pouvez également introduire une réclamation auprès de la CNIL (www.cnil.fr)."

