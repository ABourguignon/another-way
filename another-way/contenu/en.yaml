accueil:
  banniere:
    image: "banniere-accueil.jpg"
    # Partie de la photo à garder visible : "haut", "centre" ou "bas"
    cadrage: "centre"
    # Position du texte sur la photo : "gauche" ou "droite"
    texte_position: "droite"
    image_alt: "Liberty work in a covered arena"
    surtitre: "Élodie Bourguignon"
    titre: "Another Way"
    sous_titre: "Starting · Education · Training"
    bouton_prestations: "Discover the services"
    bouton_contact: "Get in touch"

  approche:
    surtitre: "The approach"
    titre: "Another way of working with horses"
    texte: |
      Before even talking about riding or performance, a period of training is necessary — and too often underestimated — to lay the foundations of healthy communication.

      Specialising in equine education and in the behavioural re-education of sport and leisure horses, Another Way, founded in 2021, offers its services to any professional or owner experiencing difficulties with their horses, or looking for an approach that respects the animal's physical and mental integrity.
    piliers:
      - titre: "Education"
        texte: "A too often underestimated period of training, to lay the foundations of healthy communication."
      - titre: "Respect"
        texte: "An approach that preserves the horse's physical and mental integrity."
      - titre: "Science"
        texte: "An ethical method based on scientific advances in our understanding of the horse's cognitive abilities."

  a_propos:
    surtitre: "About"
    titre: "Professional background"
    image: "elodie.jpg"
    image_alt: "Élodie Bourguignon with a young horse"
    texte: |
      Passionate about horses for as long as she can remember, Élodie Bourguignon naturally went on to earn her BPJEPS (French state riding instructor diploma) in Maisons-Laffitte. She then trained for 10 months at the education centre of Haras de Hus with Sébastien Jaulin and Robyn Arnold, before being hired there for 2 years. During that time she obtained the French Federation's Natural Horsemanship Instructor Certificate, levels 1 and 2.

      She then temporarily joined Grégory Wathelet's team during the Spanish Sunshine Tour, and was later recruited by the Massa stud to start and educate their young horses for 2 years.

      These experiences gave her the professional expertise she now offers under the name Another Way.
    reperes:
      - valeur: "BPJEPS"
        libelle: "Maisons-Laffitte"
      - valeur: "BFEEE 1 & 2"
        libelle: "Natural horsemanship"
      - valeur: "Since 2021"
        libelle: "Another Way"

  prestations:
    surtitre: "Services"
    titre: "Guiding each horse at its own pace"
    bouton: "See all services and rates"

  galerie:
    surtitre: "Gallery"
    titre: "At work"
    fermer: "Close"
    precedente: "Previous photo"
    suivante: "Next photo"
    images:
      - fichier: "galerie-01.jpg"
        alt: "Lungeing a young horse"
      - fichier: "galerie-02.jpg"
        alt: "Young horse under saddle in the arena"
      - fichier: "galerie-03.jpg"
        alt: "Ponying: a ridden horse leading a young horse"
      - fichier: "galerie-04.jpg"
        alt: "Competing on a chestnut horse"
      - fichier: "galerie-05.jpg"
        alt: "Horses in the paddock under the trees"
      - fichier: "galerie-06.jpg"
        alt: "Ridden session in the arena"

  appel:
    titre: "A project for your horse?"
    texte: "Let's talk about its needs and your goals."
    bouton: "Get in touch"

prestations:
  banniere:
    image: "banniere-prestations.jpg"
    # Partie de la photo à garder visible : "haut", "centre" ou "bas"
    cadrage: "haut"
    image_alt: "Ponying in an indoor arena: a ridden horse accompanying a young horse"
    surtitre: "Services"
    titre: "Services & Rates"
  intro: "From private lessons to starting young horses, every service adapts to the horse, its character and its abilities."
  libelle_tarif: "Rate"
  bouton_devis: "Request a quote"
  bouton_reserver: "Get in touch"

  liste:
    - nom: "Private lesson"
      tarif: "€65"
      image: "prestation-cours.jpg"
      accueil: true
      description: "One-to-one coaching for horse and rider together, to progress on the ground and in the saddle in a relationship of trust and mutual respect."
      details: "Content is tailored to each pair's level, goals and pace."

    - nom: "Clinic"
      tarifs:
        - libelle: "Full day"
          prix: "€130"
        - libelle: "Half day"
          prix: "€70"
      image: "prestation-stage.jpg"
      description: "Dedicated time to explore a topic in depth: groundwork, communication, foundations of education or preparing for a specific goal."

    - nom: "Savoir or Galop exam"
      tarifs:
        - libelle: "Savoir (natural horsemanship)"
          prix: "€70"
        - libelle: "Galop"
          prix: "€50"
      image: "prestation-examens.jpg"
      description: "Preparation for and assessment of the French Federation's natural horsemanship Savoirs and riding Galops, supervised by an instructor holding the BPJEPS and the Natural Horsemanship Instructor Certificate."

    - nom: "Assessment session"
      tarif: "€100"
      image: "prestation-evaluation.jpg"
      description: "A first meeting to observe the horse, understand its needs and any difficulties, and define together the most suitable work programme."

    - nom: "Horse training session"
      tarif: "€50"
      image: "prestation-travail.jpg"
      accueil: true
      description: "Establishing the basics of flatwork, physical and locomotor conditioning."
      details: "Making the horse more practical and responsive to the aids."

    - nom: "Pre-starting"
      tarif: "€350 / month"
      frequence: "4 sessions per week"
      image: "prestation-pre-debourrage.jpg"
      description: "Allows a more gradual education by establishing cues before the horse is started."
      details: "Most of the work is done on the ground and includes hoof handling and desensitisation. Saddling and mounting depending on the youngster's physical abilities."

    - nom: "Starting young horses"
      tarif: "€700 / month"
      frequence: "4 sessions per week"
      image: "prestation-debourrage.jpg"
      accueil: true
      description: "The most important stage in a horse's life. It shapes the entire future relationship between the youngster and people, and the association the horse will make with humans."
      details: "The aim is a confident, receptive horse that responds to the rider's aids. Every youngster is different, so it can take from one to several months depending on each horse's character and cognitive abilities."

    - nom: "Behavioural re-education"
      tarif: "On quote"
      image: "prestation-reeducation.jpg"
      accueil: true
      devis: true
      description: "Misunderstandings between people and horses can lead to unwanted or even dangerous behaviours. The aim is to understand why the horse developed these behaviours and to teach it the desired ones."
      details: "Re-education covers many situations: loading, fear at mounting, aggressiveness, stress and anxiety…"

  deplacements:
    titre: "Travel"
    texte: "I work near Orléans and in the Paris region, and in other areas on request. Travel costs are charged at {frais_km}, calculated from {ville_depart}."
  mention_tva: "All rates are net – VAT not applicable (art. 293 B of the French Tax Code)."

  appel:
    titre: "A question, a project?"
    texte: "Request a personalised quote or get in touch to talk about it."
    bouton: "Request a quote"

